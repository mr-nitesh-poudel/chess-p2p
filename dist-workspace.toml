[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# Keep compiled dependencies between releases, so a release rebuilds
# this crate rather than iroh and the rest from scratch on every runner
cache-builds = true
# The installers to generate for each app
installers = ["shell", "homebrew"]
# The Homebrew tap to publish the formula to, and what to call it there
tap = "mr-nitesh-poudel/homebrew-tap"
formula = "tuitui"
publish-jobs = ["homebrew"]

# Target platforms to build apps for (Rust target-triple syntax)
# Only what a GitHub runner builds natively. Windows and ARM Linux are
# plausible but untested; add them once a CI run has proved them.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

# Analysis runs the player's own Stockfish, so Homebrew installs it alongside.
# Only to run with: nothing here is built against it.
[dist.dependencies.homebrew]
stockfish = { stage = ["run"] }
