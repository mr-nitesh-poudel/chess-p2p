[package]
name = "tui-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
blake3 = "1.8.7"
crossterm = { version = "0.29.0", features = ["osc52"] }
dirs = "7.0.0"
getrandom = "0.3"
iroh = "1.2.0"
pkarr = { version = "8.0.1", default-features = false, features = ["dht"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shakmaty = "0.30.1"
spake2 = { version = "0.4", features = ["getrandom"] }
tokio = { version = "1.53.1", features = ["full"] }

# Stretching a code with Argon2 takes seconds unoptimised; tests do it a lot.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
